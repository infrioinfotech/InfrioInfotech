<script>
  (function() {
    window.toggleMobileMenu = function(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
        if (typeof e.stopImmediatePropagation === 'function') {
          e.stopImmediatePropagation();
        }
      }
      const container = document.querySelector('.elementskit-menu-container');
      const overlay = document.querySelector('.elementskit-menu-overlay');
      if (container) container.classList.toggle('active');
      if (overlay) overlay.classList.toggle('active');
    };

    window.toggleMobileDropdown = function(e, element) {
      if (window.innerWidth <= 1024) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') {
            e.stopImmediatePropagation();
          }
        }
        const parent = element.closest('.elementskit-dropdown-has');
        if (parent) {
          parent.classList.toggle('elementskit-dropdown-open');
        }
      }
    };
  })();
</script>
